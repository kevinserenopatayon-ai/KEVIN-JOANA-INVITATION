<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kevin & Joana | Wedding Invitation</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Great+Vibes&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#f8f4ef;
    font-family:'Cormorant Garamond', serif;
    overflow-x:hidden;
}

/* HERO */

.hero{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:20px;
    background:linear-gradient(rgba(255,255,255,.55), rgba(255,255,255,.55));
}

.hero-content{
    animation:fadeUp 1.8s ease;
}

.hero h3{
    font-size:22px;
    letter-spacing:4px;
    color:#96744b;
}

.hero h1{
    font-family:'Great Vibes', cursive;
    font-size:95px;
    font-weight:100;
    color:#b48442;
    margin:20px 0;
}

.hero h2{
    font-size:45px;
    letter-spacing:4px;
    color:#4a4038;
}

.hero p{
    margin-top:20px;
    font-size:24px;
    color:#555;
}

.scroll{
    margin-top:60px;
    font-size:18px;
    animation:float 2s infinite;
}

/* PAGES */

.page{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:50px 20px;

    opacity:0;
    transform:translateY(80px);
    transition:1s ease;
}

.page.show{
    opacity:1;
    transform:translateY(0);
}

.page img{
    width:100%;
    max-width:900px;
    border-radius:20px;
    box-shadow:0 20px 60px rgba(0,0,0,.15);
    display:block;
}

/* FOOTER */

.footer{
    padding:80px 20px;
    text-align:center;
}

.footer h2{
    font-family:'Great Vibes', cursive;
    font-size:55px;
    color:#b48442;
}

.footer p{
    margin-top:15px;
    font-size:24px;
    color:#555;
}

/* ANIMATIONS */

@keyframes fadeUp{
    from{
        opacity:0;
        transform:translateY(40px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes float{
    0%{transform:translateY(0);}
    50%{transform:translateY(12px);}
    100%{transform:translateY(0);}
}

/* MOBILE */

@media(max-width:768px){

.hero h1{
    font-size:60px;
}

.hero h2{
    font-size:28px;
}

.hero h3{
    font-size:16px;
}

.hero p{
    font-size:18px;
}

.footer h2{
    font-size:42px;
}

.footer p{
    font-size:18px;
}

}

</style>

</head>

<body>

<!-- HERO -->

<section class="hero">

    <div class="hero-content">

        <h3>WE ARE HONORED TO INVITE YOU TO WITNESS</h3>

        <h1>Kevin & Joana</h1>

        <h2>Wedding Fellowship</h2>

        <p>October 22, 2026 • 4:30 PM</p>

        <div class="scroll">
            ▼ Scroll Down ▼
        </div>

    </div>

</section>

<!-- INVITATION -->

<section class="page">
    <img src="images/invitation.png" alt="Invitation">
</section>

<!-- ATTIRE -->

<section class="page">
    <img src="images/attire.png" alt="Attire">
</section>

<!-- LOCATION -->

<section class="page">
    <img src="images/venue.png" alt="Location">
</section>

<!-- FOOTER -->

<section class="footer">

    <h2>We Can't Wait to Celebrate With You!</h2>

    <p>See you on October 22, 2026</p>

</section>

<script>

const pages = document.querySelectorAll(".page");

const observer = new IntersectionObserver((entries)=>{

    entries.forEach(entry=>{

        if(entry.isIntersecting){

            entry.target.classList.add("show");

        }

    });

},{
    threshold:0.2
});

pages.forEach(page=>observer.observe(page));

</script>

</body>
</html>
