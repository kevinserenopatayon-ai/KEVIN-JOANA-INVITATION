<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kevin & Joana | Wedding Invitation</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#f8f4ef;
    font-family:'Cormorant Garamond',serif;
    overflow-x:hidden;
}

/* HERO */

.hero{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:20px;
}

.hero h3{
    color:#96744b;
    letter-spacing:4px;
    font-size:18px;
}

.hero h1{
    font-family:'Great Vibes',cursive;
    font-size:90px;
    color:#b48442;
    margin:20px 0;
}

.hero h2{
    font-size:40px;
    color:#4a4038;
    letter-spacing:3px;
}

.hero p{
    margin-top:20px;
    font-size:22px;
    color:#666;
}

.scroll{
    margin-top:50px;
    animation:float 2s infinite;
    color:#96744b;
}

/* IMAGE SECTION */

.page{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:50px 20px;
    opacity:0;
    transform:translateY(80px);
    transition:opacity 1s ease, transform 1s ease;
}

.page.show{
    opacity:1;
    transform:translateY(0);
}

.page img{
    width:100%;
    max-width:900px;
    display:block;
    border-radius:20px;
    box-shadow:0 20px 50px rgba(0,0,0,.15);
}

/* FOOTER */

.footer{
    padding:80px 20px;
    text-align:center;
}

.footer h2{
    font-family:'Great Vibes',cursive;
    font-size:55px;
    color:#b48442;
}

.footer p{
    margin-top:15px;
    font-size:22px;
    color:#666;
}

/* ANIMATION */

@keyframes float{
    0%{transform:translateY(0);}
    50%{transform:translateY(10px);}
    100%{transform:translateY(0);}
}

/* MOBILE */

@media (max-width:768px){

.hero h1{
    font-size:60px;
}

.hero h2{
    font-size:28px;
}

.hero h3{
    font-size:15px;
}

.hero p{
    font-size:18px;
}

.footer h2{
    font-size:40px;
}

}

</style>

</head>

<body>

<section class="hero">

<div>

<h3> </h3>

<h1>Kevin &amp; Joana</h1>

<h2>Wedding Fellowship</h2>

<p>October 22, 2026 • 4:30 PM</p>

<div class="scroll" aria-hidden="true">
∆ Scroll Up ∆
</div>

</div>

</section>

<section class="page">
    <img src="images/invitation.png" alt="Wedding Invitation" loading="eager">
</section>

<section class="page">
    <img src="images/ware.png" alt="Wedding Attire" loading="lazy">
</section>

<section class="page">
    <img src="images/rsvp.png" alt="RSVP Information" loading="lazy">
</section>

<section class="page">
    <img src="images/venue.png" alt="Wedding Venue" loading="lazy">
</section>

<section class="footer">

<h2>We are incomplete without you!</h2>

<p> </p>

</section>

<script>

const observer = new IntersectionObserver((entries) => {

    entries.forEach((entry) => {

        if (entry.isIntersecting) {
            entry.target.classList.add("show");
        }

    });

}, {
    threshold: 0.2
});

document.querySelectorAll(".page").forEach((page) => {
    observer.observe(page);
});

</script>

</body>
</html>
