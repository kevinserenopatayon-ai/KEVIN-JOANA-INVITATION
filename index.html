<main id="wedding">

  <!-- =====================================================
       PAGE 1 — WELCOME
       ===================================================== -->
  <section
    class="page welcome-page"
    id="welcome"
    aria-label="Welcome"
  >
    <div class="gold-frame" aria-hidden="true"></div>

    <div class="welcome-content reveal">

      <h1>
        Kevin <span>&amp;</span> Joana
      </h1>

      <div class="divider" aria-hidden="true">
        <i></i>
        <b>✦</b>
        <i></i>
      </div>

      <h2>WEDDING FELLOWSHIP</h2>

      <p class="date">
        JANUARY 22, 2027
        <span>@</span>
        4:30PM
      </p>

      <p class="scroll-hint">
        SCROLL TO BEGIN
      </p>

    </div>
  </section>


  <!-- =====================================================
       PAGE 2 — INVITATION
       ===================================================== -->
  <section
    class="page artwork-page"
    id="invitation"
    aria-label="Wedding Invitation"
  >
    <div class="artwork-shell reveal">

      <img
        src="assets/wedding-invitation.png"
        alt="Kevin and Joana wedding invitation"
        draggable="false"
      >

    </div>
  </section>


  <!-- =====================================================
       PAGE 3 — ATTIRE
       ===================================================== -->
  <section
    class="page artwork-page"
    id="attire"
    aria-label="What to Wear"
  >
    <div class="artwork-shell reveal">

      <img
        src="assets/what-to-wear.png"
        alt="What to wear — wedding motif and color palette"
        draggable="false"
      >

    </div>
  </section>


  <!-- =====================================================
       PAGE 4 — RSVP
       ===================================================== -->
  <section
    class="page artwork-page"
    id="rsvp"
    aria-label="RSVP and Gifts"
  >
    <div class="artwork-shell reveal">

      <img
        src="assets/wedding-rsvp.png"
        alt="Wedding gifts and RSVP information"
        draggable="false"
      >

    </div>
  </section>


  <!-- =====================================================
       PAGE 5 — VENUE
       ===================================================== -->
  <section
    class="page artwork-page"
    id="venue"
    aria-label="Wedding Venue"
  >
    <div class="artwork-shell reveal">

      <img
        src="assets/wedding-venue.png"
        alt="Don Jose Heights Clubhouse location and map"
        draggable="false"
      >

    </div>
  </section>


  <!-- =====================================================
       PAGE 6 — FINAL PAGE
       ===================================================== -->
  <section
    class="page final-page"
    id="final"
    aria-label="Closing Message"
  >
    <div
      class="gold-frame"
      aria-hidden="true"
    ></div>

    <div class="final-content reveal">

      <h2>
        We are incomplete<br>
        without you.
      </h2>

      <p class="signature">
        Kevin &amp; Joana
      </p>

    </div>
  </section>

</main>


<!-- =======================================================
     PAGE NAVIGATION
     ======================================================= -->
<nav
  class="page-dots"
  aria-label="Wedding invitation pages"
>

  <button
    class="dot active"
    type="button"
    data-page="0"
    aria-label="Go to welcome page"
    aria-current="page"
  ></button>

  <button
    class="dot"
    type="button"
    data-page="1"
    aria-label="Go to invitation page"
  ></button>

  <button
    class="dot"
    type="button"
    data-page="2"
    aria-label="Go to attire page"
  ></button>

  <button
    class="dot"
    type="button"
    data-page="3"
    aria-label="Go to RSVP page"
  ></button>

  <button
    class="dot"
    type="button"
    data-page="4"
    aria-label="Go to venue page"
  ></button>

  <button
    class="dot"
    type="button"
    data-page="5"
    aria-label="Go to final page"
  ></button>

</nav>


<!-- =======================================================
     PAGE COUNTER
     ======================================================= -->
<div
  class="page-counter"
  aria-hidden="true"
>
  <span id="currentPage">01</span>
  <em>/</em>
  <span>06</span>
</div>


<!-- =======================================================
     CORNER BRANDING
     ======================================================= -->
<div
  class="corner-note"
  aria-hidden="true"
>
  K &amp; J
</div>


<!-- =======================================================
     JAVASCRIPT
     ======================================================= -->
<script src="script.js"></script>

</body>
</html>
