<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kevin & Joana | Wedding Invitation</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Great+Vibes&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

background:#f8f4ef;
font-family:'Cormorant Garamond',serif;
overflow-x:hidden;

}

.hero{

height:100vh;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
background:linear-gradient(rgba(255,255,255,.5),rgba(255,255,255,.5));

}

.hero-content{

animation:fadeUp 2s ease;

}

.hero h3{

letter-spacing:4px;
font-size:22px;
color:#96744b;

}

.hero h1{

font-family:'Great Vibes',cursive;
font-size:95px;
font-weight:100;
color:#b48442;
margin:20px 0;

}

.hero h2{

font-size:45px;
letter-spacing:5px;
color:#4a4038;

}

.hero p{

margin-top:25px;
font-size:24px;
color:#555;

}

.scroll{

margin-top:70px;
font-size:18px;
animation:float 2s infinite;

}

.page{

padding:80px 0;
display:flex;
justify-content:center;

}

.card{

width:900px;
max-width:90%;
background:white;
padding:30px;
border-radius:20px;
box-shadow:0 20px 50px rgba(0,0,0,.1);

opacity:0;
transform:translateY(80px);

transition:1s;

}

.card.show{

opacity:1;
transform:translateY(0);

}

.card img{

width:100%;
border-radius:15px;

}

.footer{

text-align:center;
padding:80px;

}

.footer h2{

font-family:'Great Vibes',cursive;
font-size:55px;
color:#b48442;

}

.footer p{

margin-top:20px;
font-size:22px;

}

@keyframes fadeUp{

from{

opacity:0;
transform:translateY(50px);

}

to{

opacity:1;
transform:translateY(0);

}

}

@keyframes float{

0%{transform:translateY(0);}
50%{transform:translateY(12px);}
100%{transform:translateY(0);}

}

</style>

</head>

<body>

<section class="hero">

<div class="hero-content">

<h3>WE ARE HONORED TO INVITE YOU TO WITNESS</h3>

<h1>Kevin & Joana</h1>

<h2>Wedding Fellowship</h2>

<p>October 22, 2026 • 4:30 PM</p>

<div class="scroll">

▼ Scroll Down ▼

</div>

</div>

</section>

<section class="page">

<div class="card reveal">

<section class="page">
    <img src="images/invitation.png" alt="Invitation">
</section>

<section class="page">
    <img src="images/attire.png" alt="Attire">
</section>

<section class="page">
    <img src="images/location.png" alt="Location">
</section>

</div>

</section>

<section class="footer">

<h2>We Can't Wait to Celebrate With You!</h2>

<p>See you on October 22, 2026</p>

</section>

<script>

const reveals=document.querySelectorAll(".reveal");

window.addEventListener("scroll",()=>{

for(let i=0;i<reveals.length;i++){

const windowHeight=window.innerHeight;

const top=reveals[i].getBoundingClientRect().top;

const visible=150;

if(top<windowHeight-visible){

reveals[i].classList.add("show");

}

}

});

</script>

</body>
</html>
